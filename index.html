<!doctype html>
<html lang="it">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Esperienza Intima</title>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Manrope:wght@300;400;600;700&display=swap"
        rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: Manrope, sans-serif;
            background: #0B1C2D;
            color: white;
        }

        .wrap {
            max-width: 900px;
            margin: auto;
            padding: 40px 20px;
        }

        .card {
            background: rgba(255, 255, 255, .05);
            border: 1px solid rgba(255, 255, 255, .1);
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 20px;
            cursor: pointer;
            perspective: 1200px;
        }

        .flip-inner {
            transform-style: preserve-3d;
            transition: transform .7s ease;
            position: relative;
        }

        .card.open .flip-inner {
            transform: rotateX(180deg);
        }

        .flip-face {
            backface-visibility: hidden;
        }

        .flip-back {
            position: absolute;
            inset: 0;
            transform: rotateX(180deg);
        }

        .front-title {
            font-family: Cinzel, serif;
            font-size: 22px;
            margin: 0 0 6px;
        }

        .front-sub {
            opacity: .7;
            margin: 0 0 10px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 16px;
            border-radius: 14px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            text-decoration: none;
        }

        .btn-primary {
            background: linear-gradient(90deg, #c64a6c, #ff7aa8);
            color: white;
        }

        .btn-minimal {
            background: rgba(255, 255, 255, .08);
            color: white;
            border: 1px solid rgba(255, 255, 255, .15);
        }

        .audio-wrap {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 12px;
        }

        .audio-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            background: linear-gradient(90deg, #c64a6c, #ff7aa8);
            color: white;
            font-size: 18px;
        }

        .audio-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            background: #ffd6a0;
            margin-right: 6px;
        }

        .audio-dot.paused {
            background: #7a8abf;
        }

        .muted {
            opacity: .7;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <main class="wrap">

        <!-- ORA -->
        <section class="card flip" id="oraCard">
            <div class="flip-inner">

                <div class="flip-face">
                    <h3 class="front-title">ora</h3>
                    <p class="front-sub">Un istante piccolo. Solo tuo.</p>
                </div>

                <div class="flip-face flip-back">
                    <p class="muted">Scegli cosa ascoltare.</p>

                    <audio id="audioPlayer" preload="none"></audio>

                    <div class="audio-wrap">
                        <button class="audio-btn" id="playBtn">▶</button>

                        <div>
                            <div id="currentTitle">Seleziona un episodio</div>
                            <div>
                                <span class="audio-dot paused" id="audioDot"></span>
                                <span id="audioLabel">Riproduci</span>
                            </div>
                        </div>
                    </div>

                    <div id="episodeList"
                        style="display:flex; flex-direction:column; gap:8px;">
                    </div>

                </div>
            </div>
        </section>

        <!-- PROSSIMA VOLTA -->
        <section class="card flip">
            <div class="flip-inner">

                <div class="flip-face">
                    <h3 class="front-title">prossima volta</h3>
                    <p class="front-sub">Non è un piano. È un invito.</p>
                </div>

                <div class="flip-face flip-back">
                    <p class="muted">
                        Il prossimo passo non si spiega.
                        Si raggiunge.
                    </p>

                    <a href="https://www.google.com/maps"
                        target="_blank"
                        class="btn btn-primary">
                        Apri su Google Maps
                    </a>
                </div>

            </div>
        </section>

    </main>

    <script>

        // FLIP
        document.querySelectorAll(".card").forEach(card => {
            card.addEventListener("click", e => {
                if (e.target.closest("button") || e.target.closest("a")) return;
                card.classList.toggle("open");
            });
        });

        // PODCAST MULTI EPISODIO
        (function () {

            const episodes = [
                { title: "Episodio 1 – Un piccolo segnale", file: "audio/ep01.mp3" },
                { title: "Episodio 2 – Il secondo passo", file: "audio/ep02.mp3" },
                { title: "Episodio 3 – Più vicino", file: "audio/ep03.mp3" }
            ];

            const player = document.getElementById("audioPlayer");
            const playBtn = document.getElementById("playBtn");
            const title = document.getElementById("currentTitle");
            const dot = document.getElementById("audioDot");
            const label = document.getElementById("audioLabel");
            const list = document.getElementById("episodeList");

            let current = null;

            function setState(playing) {
                if (playing) {
                    playBtn.textContent = "❚❚";
                    label.textContent = "Pausa";
                    dot.classList.remove("paused");
                } else {
                    playBtn.textContent = "▶";
                    label.textContent = "Riproduci";
                    dot.classList.add("paused");
                }
            }

            function loadEpisode(i) {
                current = i;
                player.src = episodes[i].file;
                title.textContent = episodes[i].title;
                setState(false);
            }

            playBtn.addEventListener("click", async () => {
                if (current === null) return;

                if (player.paused) {
                    await player.play();
                    setState(true);
                } else {
                    player.pause();
                    setState(false);
                }
            });

            player.addEventListener("ended", () => setState(false));

            episodes.slice().reverse().forEach((ep, i) => {

                const realIndex = episodes.length - 1 - i;

                const btn = document.createElement("button");
                btn.textContent = ep.title;
                btn.className = "btn btn-minimal";
                btn.onclick = () => loadEpisode(realIndex);

                list.appendChild(btn);
            });

        })();

    </script>

</body>
</html>
